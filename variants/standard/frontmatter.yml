compatibility: Requires Node 18+ (the signing library is vendored — no install needed); needs network access to hypawave.com. Seller and wave (signed) operations read HYPAWAVE_PRIVKEY; the buyer flow needs no key. Full function needs the Hypawave MCP server in a coding agent.
